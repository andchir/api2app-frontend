<div class="relative" [ngClass]="{'!fixed left-0 top-0 w-full h-full z-50 bg-black': isFullScreenMode()}">
    @if (safeUrl() || !hiddenByDefault()) {
        <div class="iframe-container relative w-full bg-gray-200"
             [ngClass]="{'border border-gray-300': border()}"
             #iframeContainer>
            <div class="mx-auto" [ngStyle]="{'width': iframeWidth() + '%'}">
                <div class="w-full flex items-stretch">
                    <div class="iframe-wrapper w-full">
                        <iframe [attr.srcdoc]="htmlContent() ? safeHtmlContent() : null"
                                [attr.src]="!htmlContent() ? safeUrl() : null"
                                [ngStyle]="{'height': heightCurrent() + 'px'}"
                                [ngClass]="{'pointer-events-none': isResizing() || editorMode()}"
                                class="block w-full"
                                frameborder="0"
                                sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-modals allow-forms allow-downloads"
                                allow="accelerometer; autoplay; microphone; camera; clipboard-read; clipboard-write; display-capture; midi;"
                                allowfullscreen #iframeEl></iframe>
                    </div>

                    @if (isResizerEnabled()) {
                        <div class="bg-gray-100 resizer-handle flex items-center justify-center cursor-col-resize select-none w-[15px] border-l border-l-gray-300"
                             [ngClass]="{'border-r border-r-gray-300': iframeWidth() < 100}"
                             [class.active]="isResizing()"
                             (mousedown)="onMouseDown($event)"
                             (touchstart)="onTouchStart($event)">
                            <div class="resizer-line bg-gray-400 pointer-events-none w-[3px] h-[40px] rounded-full"></div>
                        </div>
                    }
                </div>
            </div>
        </div>
    }

    @if (useRefreshButton() || useFullscreenButton()) {
        <div class="flex shrink-0 gap-3 justify-center py-3 bg-white"
             [ngClass]="{'pointer-events-none opacity-80': isLoading()}"
             #controlsPanel>
            @if (useRefreshButton()) {
                <button type="button"
                        class="py-2.5 px-5 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100"
                        (click)="refreshContentAction()">
                    <i class="bi bi-arrow-repeat mr-2"></i>
                    <span i18n>Refresh</span>
                </button>
            }

            @if (useFullscreenButton()) {
                <button type="button"
                        class="py-2.5 px-5 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100"
                        (click)="fullScreenToggle()">
                    @if (isFullScreenMode()) {
                        <i class="bi bi-fullscreen-exit mr-2"></i>
                    } @else {
                        <i class="bi bi-arrows-fullscreen mr-2"></i>
                    }
                    <span i18n>Full Screen</span>
                </button>
            }
        </div>
    }
    @if (isLoading()) {
        <div class="absolute inset-0 bg-white/50">
            <div role="status" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12">
                <svg aria-hidden="true" class="w-12 h-12 text-gray-300 animate-spin fill-blue-700" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/><path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/></svg>
                <span class="sr-only">Loading...</span>
            </div>
        </div>
    }
</div>
